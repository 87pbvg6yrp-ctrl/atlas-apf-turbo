name: Bug report
description: Report a reproducible software problem in ATLAS APF TURBO
title: "[BUG] "
labels: []
body:
  - type: input
    id: version
    attributes:
      label: APF version
      placeholder: "1.2.3"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11"
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and any error text.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the shortest reliable sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots or other non-sensitive details can go here.
